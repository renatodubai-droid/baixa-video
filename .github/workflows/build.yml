name: Gerar APK Baixa Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip Baixa-Video-projeto-Android-v3.zip -d projeto

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: projeto/gradle/wrapper/gradle-wrapper.properties

      - name: Preparar Android
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: false

      - name: Gerar APK
        working-directory: projeto
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGenericDebug -PnoSplits --stacktrace

      - name: Separar APK
        run: |
          mkdir entrega
          cp projeto/app/build/outputs/apk/generic/debug/*.apk entrega/Baixa-Video.apk
          sha256sum entrega/Baixa-Video.apk
          stat -c '%n %s bytes' entrega/Baixa-Video.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Baixa-Video-APK
          path: entrega/Baixa-Video.apk

      - name: Publicar APK para celular
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0-alpha.6 entrega/Baixa-Video.apk --target "$GITHUB_SHA" --title "Baixa Vídeo 2.0.0 alpha 6" --notes "Acompanhamento real do download e notificações desde a preparação." --prerelease
